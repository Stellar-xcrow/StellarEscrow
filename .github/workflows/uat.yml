name: UAT

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]
      notify_webhook:
        description: 'Slack/Teams webhook URL for results'
        required: false
        type: string

concurrency:
  group: uat-${{ github.ref }}
  cancel-in-progress: false  # Never cancel UAT mid-run

jobs:
  uat:
    name: UAT (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: stellar_escrow
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build indexer
        run: cargo build --release -p stellar-escrow-indexer

      - name: Run migrations
        run: sqlx migrate run
        working-directory: indexer
        env:
          DATABASE_URL: postgres://indexer:password@localhost:5432/stellar_escrow

      - name: Start indexer
        run: |
          ./target/release/stellar-escrow-indexer --config indexer/config.toml &
          echo $! > /tmp/indexer.pid
          sleep 5
        env:
          DATABASE_URL: postgres://indexer:password@localhost:5432/stellar_escrow
          RUST_LOG: warn

      - name: Install UAT dependencies
        run: npm ci
        working-directory: testing/uat

      - name: Run automated UAT
        run: node scripts/run-automated-uat.js --env ${{ github.event.inputs.environment || 'staging' }}
        working-directory: testing/uat
        env:
          UAT_BASE_URL: http://localhost:3000
          UAT_ENV: ${{ github.event.inputs.environment || 'staging' }}
          UAT_WEBHOOK: ${{ github.event.inputs.notify_webhook || secrets.UAT_WEBHOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload UAT reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uat-reports-${{ github.run_number }}
          path: testing/uat/reports/
          retention-days: 90

      - name: Stop indexer
        if: always()
        run: kill $(cat /tmp/indexer.pid) || true
